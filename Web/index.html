<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#d8dee8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Qopy</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <p class="eyebrow">Qopy</p>
      <h1>Send to Mac</h1>
    </header>

    <section class="glass card">
      <div id="text-block" class="text-block">
        <label class="field-label" for="text">Paste text</label>
        <textarea id="text" rows="5" placeholder="Paste anything…" autofocus></textarea>
        <div class="meta">
          <span id="byte-count">0 / 100000</span>
          <span id="warn" class="warn" hidden></span>
        </div>
      </div>

      <div class="rule"><span>or</span></div>

      <div id="selection" class="selection" hidden>
        <div id="thumbs" class="thumbs"></div>
        <div class="selection-text">
          <span id="selection-title" class="selection-title"></span>
          <span id="selection-sub" class="selection-sub"></span>
        </div>
        <button id="clear" class="clear" type="button" aria-label="Remove selected files">✕</button>
      </div>

      <label id="picker" class="picker" for="files">
        <input id="files" type="file" multiple>
        <span id="picker-label">Choose photos or files</span>
      </label>

      <button id="send" class="primary" type="button" disabled>Send to Mac</button>
      <p id="status" class="hint" hidden></p>
    </section>
  </main>
</body>
</html>
