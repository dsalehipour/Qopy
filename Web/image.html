<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d8dee8">
  <title>Images from Mac · Qopy</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/image.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="brand"><p class="eyebrow">Qopy</p><h1 id="title">Image from Mac</h1></header>
    <section class="glass card">
      <button id="download-all" class="primary" type="button" hidden>Download all</button>
      <div id="gallery" class="gallery"></div>
      <p id="image-status" class="hint" role="status">Loading…</p>
      <p id="image-help" class="hint">Keep Qopy’s send panel open on your Mac until you have saved them. You can also touch and hold an image to save or copy it.</p>
    </section>
  </main>
</body>
</html>
